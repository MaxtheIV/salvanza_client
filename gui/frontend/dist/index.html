<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimbus Backup - RDEM Systems</title>
    <style>
        /* Pre-mount styles only. Everything else lives in src/index.css.
           These values must track --bg / --text there: they are what the window
           paints for the few frames before React mounts, so a mismatch shows up
           as a colour flash on every launch. */
        :root { color-scheme: light dark; }
        html, body, #root { height: 100%; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
            background: oklch(0.982 0.003 243);
            color: oklch(0.255 0.014 243);
            overflow: hidden;
        }
        @media (prefers-color-scheme: dark) {
            body:not([data-theme='light']) {
                background: oklch(0.178 0.011 243);
                color: oklch(0.935 0.006 243);
            }
        }
    </style>
    <script>
        // Apply the stored theme before first paint so a user who picked dark
        // does not get a light flash while the bundle loads.
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
  <script type="module" crossorigin src="/assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index.css">
</head>
<body>
    <div id="root"></div>
</body>
</html>
